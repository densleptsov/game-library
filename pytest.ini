[pytest]
# Куда pytest ищет тесты (по умолчанию и так test_*.py, но зафиксируем явно)
testpaths = tests

# Маска файлов с тестами
python_files = test_*.py

# Маска классов и функций с тестами
python_classes = Test*
python_functions = test_*

# Опции командной строки, применяемые всегда
# -v: verbose (показывать имена тестов)
# --strict-markers: падать, если используется маркер не из списка
# --tb=short: traceback покороче
addopts =
    -v
    --strict-markers
    --tb=short

# Пользовательские маркеры (метки тестов)
# Позволяют запускать: pytest -m smoke, pytest -m "not slow"
markers =
    smoke: Быстрые smoke-тесты (проверка живости API)
    api: API-тесты
    ui: UI-тесты (Playwright)
    slow: Медленные тесты (например, требующие перезапуска сервера)